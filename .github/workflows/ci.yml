name: decode-parity

# The CuTeDSL decode kernel is SM90 (Hopper) only, so correctness CI must run
# on a self-hosted runner with an H100/H200. Register a runner with the labels
# below (Settings -> Actions -> Runners):
#     [self-hosted, linux, x64, gpu, sm90]
#
# The job installs the lightweight [test] extra (pytest + cutlass-dsl; the
# parity tests compare against the in-repo fp32 reference, no flash_attn) and
# runs the decode parity + API-contract matrix.

on:
  push:
    branches: [main]
    paths:
      - "parallax/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "parallax/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decode-parity:
    runs-on: [self-hosted, linux, x64, gpu, sm90]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show GPU
        run: nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv

      - name: Set up environment (uv)
        run: |
          python -m pip install --upgrade pip uv
          # Off-/home caches keep the runner disk from filling.
          export UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache"
          uv venv "${RUNNER_TEMP}/venv"
          source "${RUNNER_TEMP}/venv/bin/activate"
          uv pip install -e '.[test]'
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/venv" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Run decode parity + API matrix
        env:
          CUDA_VISIBLE_DEVICES: "0"
          # Persist the CuTeDSL JIT cache across runs to amortize compile cost.
          CUDA_CACHE_PATH: ${{ runner.temp }}/cuda-cache
        run: |
          source "${RUNNER_TEMP}/venv/bin/activate"
          pytest tests/ -v --durations=15
