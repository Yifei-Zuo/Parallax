name: Release

# Publishes to PyPI via trusted publishing (OIDC, no API token) when a
# version tag is pushed. One-time setup on PyPI: add a "pending publisher"
# for project `parallax-kernel` with owner Yifei-Zuo, repo Parallax,
# workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match project version $ver" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Install the built wheel on a clean GPU-less runner and import it.
  # CPU torch keeps the download small; the cute extra is absent, so this
  # also exercises the cute_decode_available=False fallback path.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install dist/*.whl
      - run: |
          python -c "
          import parallax
          assert parallax.__version__ != '0.0.0+unknown'
          print('version:', parallax.__version__)
          assert parallax.cute_decode_available is False
          print('cute_decode_available:', parallax.cute_decode_available)
          from parallax import parallax_func, parallax_varlen_func, parallax_reference
          print('imports OK')
          "

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parallax-kernel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
