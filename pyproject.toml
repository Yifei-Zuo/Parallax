[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
description = "Parallax kernel package."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Yifei Zuo" },
    { name = "Dhruv Pai" },
    { name = "Zhichen Zeng" },
]
keywords = ["attention", "cutlass", "cute", "decode", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.9.1",
    "triton==3.5.1",
    "nvidia-cutlass-dsl==4.1.0",
    "nvidia-cutlass-dsl-libs-base",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["psutil", "rich>=13", "flash_attn>=2.8.3"]

[project.urls]
Homepage = "https://github.com/Yifei-Zuo/Parallax"
Repository = "https://github.com/Yifei-Zuo/Parallax"

[tool.setuptools.packages.find]
include = ["parallax*"]
exclude = ["scripts*", "assets*"]

[tool.uv]
# flash_attn (FA2) imports torch in setup.py — disable build isolation so
# its build env matches the runtime torch version.
no-build-isolation-package = ["flash_attn"]
# The pytorch wheel index needs this hint to resolve x86_64 wheels.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
