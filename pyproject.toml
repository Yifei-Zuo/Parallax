[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
description = "Parallax kernel package."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Yifei Zuo" },
    { name = "Dhruv Pai" },
    { name = "Zhichen Zeng" },
]
keywords = ["attention", "cutlass", "cute", "decode", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core deps are everything the Triton training path needs. The cute-based
# SM90 decode / prefill kernels live behind the [decode] extra so a clone
# of this repo aimed at training does not have to install the cutlass-dsl
# stack (~200MB of nvidia-* wheels + a Hopper-only constraint).
dependencies = [
    "torch==2.9.1",
    "triton==3.5.1",
    "numpy",
]

[project.optional-dependencies]
# Cute-based SM90 kernels (parallax_decode, parallax_prefill). Hopper only.
decode = [
    "nvidia-cutlass-dsl==4.1.0",
    "nvidia-cutlass-dsl-libs-base",
]
# The bench harness compares the decode kernel against FA2 and runs the
# parity tests, so it pulls the [decode] stack plus flash_attn + pytest.
bench = [
    "psutil",
    "rich>=13",
    "flash_attn>=2.8.3",
    "pytest>=7",
    "nvidia-cutlass-dsl==4.1.0",
    "nvidia-cutlass-dsl-libs-base",
]
# Minimal test stack: pytest + the [decode] kernels. The parity tests compare
# against the in-repo fp32 reference (no flash_attn needed), so this is lighter
# than [bench] and is what CI installs.
test = [
    "pytest>=7",
    "nvidia-cutlass-dsl==4.1.0",
    "nvidia-cutlass-dsl-libs-base",
]

[project.urls]
Homepage = "https://github.com/Yifei-Zuo/Parallax"
Repository = "https://github.com/Yifei-Zuo/Parallax"

[tool.setuptools.packages.find]
include = ["parallax*"]
exclude = ["scripts*", "assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect the exhaustive `stress` sweep by default (it JIT-compiles the
# long-kv_len / large-split shapes that cost minutes each). Run it explicitly
# with `pytest -m stress`.
addopts = "-ra -m 'not stress'"
markers = [
    "sm90: test requires an SM90 (Hopper) GPU",
    "stress: exhaustive shape sweep (slow to JIT-compile; opt-in via -m stress)",
]

[tool.uv]
# flash_attn (FA2) imports torch in setup.py — disable build isolation so
# its build env matches the runtime torch version.
no-build-isolation-package = ["flash_attn"]
# The pytorch wheel index needs this hint to resolve x86_64 wheels.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
